name: Manual read-only review

on:
  workflow_dispatch:
    inputs:
      pull_number:
        description: 'Optional PR number to inspect in the repository (blank runs a synthetic demo)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm ci --no-audit --no-fund
      - name: Run simulated reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PR: ${{ inputs.pull_number }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ -z "$INPUT_PR" ]]; then
            npm run demo
          elif [[ "$INPUT_PR" =~ ^[0-9]+$ ]]; then
            npm run build
            node dist/src/cli.js --repo "$REPO" --pr "$INPUT_PR" --provider mock
          else
            echo "Invalid PR number"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: read-only-review
          path: reports/*.md
          if-no-files-found: error
