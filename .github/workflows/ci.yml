name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, types, tests, build, synthetic eval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install dependencies without running audit during install
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Prettier diagnostic for simulated publication test
        run: |
          npx prettier --write tests/integration/publish.test.ts
          node --input-type=module -e 'import fs from "node:fs";console.log("__FORMATTED_PUBLISH__"+JSON.stringify(fs.readFileSync("tests/integration/publish.test.ts","utf8")))'
          git diff --quiet
      - name: TypeScript strict check
        run: npm run typecheck
      - name: Vitest unit and integration mocks
        run: npm test
      - name: Synthetic regression evaluation (no real LLM)
        run: npm run evaluate
      - name: Production build
        run: npm run build
      - name: Reproducible offline demo (no paid API)
        run: npm run demo
      - name: Upload demo Markdown
        uses: actions/upload-artifact@v4
        with:
          name: simulated-review-report
          path: reports/demo.md
          if-no-files-found: error
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
